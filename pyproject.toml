[project]
name = "general-intuition"
version = "0.1.0"
description = "Agent harness that generates game environments and then plays them"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0",
    "hydra-core>=1.3",
    "ursina>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Modular packages under src/: agents, engine, geometry, navigation, prompts, world
[tool.setuptools.packages.find]
where = ["src"]
