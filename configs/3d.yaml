# Configuration for `python -m harness_3d {generate,play,run,replay}`.
# Only the command and `--offline` are CLI flags; everything else lives here.
# Any key you omit surfaces as an OmegaConf error where it is read.

defaults:
  - agent: codex    # which CLI to drive — see configs/agent/{claude,codex}.yaml
  - _self_

# Agent-agnostic knobs; the binary/model/effort come from the group above.
agent:
  timeout: 900.0        # seconds per agent call — a whole world is a long answer
  retries: 2            # retries per failed agent call

world:
  bounds: 60.0              # cube side; the world spans [-30, 30] on every axis
  player_radius: 0.6        # the player is a sphere, the camera sits at its centre
  mesh_resolution: 16       # latitude bands in a render mesh (longitude gets twice that)
  collision_resolution: 8   # the coarser mesh collision and line of sight are measured against

generation:
  brief: null               # optional text directing the generator; ignored by --offline
  target_primitives: 48     # what the prompt asks for
  min_primitives: 12        # fewer valid ones than this rejects the whole world
  max_primitives: 80        # enforced before anything is meshed
  exponent_range: [0.1, 4.0]
  validation_spacing: 3.0   # free-space voxel spacing for the reachability witness
  min_free_voxels: 400      # smallest acceptable connected free component
  min_key_distance: 24.0    # minimum spawn-to-key distance along the witness graph

sensor:
  range: 45.0               # how far the parameter sensor reaches
  fov: 70.0                 # horizontal field of view, degrees; also the render camera's
  aspect: 1.6               # width / height, used for the vertical frustum bound

episode:
  policy: agent             # agent (the CLI chosen above) | manual (WASD + mouse)
  max_calls: 40             # maximum agent calls
  max_waypoints: 8          # maximum target positions per call
  max_segment: 15.0         # maximum distance per target position
  max_distance: 600.0       # maximum total distance travelled
  max_collisions: 20        # maximum collisions before the episode ends
  move_increment: 0.5       # collision/observation granularity along a segment
  manual_speed: 12.0        # units per second in manual flight
  mouse_sensitivity: 40.0   # degrees per unit of mouse velocity
  step_delay: 0.0           # extra seconds per executed increment
